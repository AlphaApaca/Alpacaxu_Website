name: Sync published repytorch writing

# Only starts polling after this file is merged into the default branch.
# Public-repository schedules can be delayed or disabled after 60 inactive days.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repytorch-content-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'AlphaApaca/Alpacaxu_Website' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
      CI: "true"
    steps:
      - name: Check out the website default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24, verified 2026-10-03
        with:
          ref: main
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0, Node 24, verified 2026-10-03
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install locked dependencies
        run: npx --yes pnpm@11.19.0 install --frozen-lockfile
      - name: Import the latest explicitly published Markdown
        run: npm run sync:repytorch
        env:
          REPYTORCH_REF: main
          GITHUB_TOKEN: ${{ github.token }}
      - name: Run regression tests and verify the immutable imported snapshot
        run: |
          node --test scripts/*.test.mjs
          npm run sync:repytorch:check
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Check Astro and build before proposing any changes
        run: |
          npm run check
          npm run build
      - name: Protect manual work on the managed branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          const base = "https://api.github.com/repos/AlphaApaca/Alpacaxu_Website/";
          const headers = {
            Accept: "application/vnd.github+json",
            "X-GitHub-Api-Version": "2022-11-28",
            Authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
          };
          const request = (path) => fetch(new URL(path, base), {
            headers, redirect: "error", signal: AbortSignal.timeout(10000),
          });
          const ref = await request("git/ref/heads/codex/repytorch-sync");
          if (ref.status === 404) process.exit(0);
          if (!ref.ok) throw new Error(`Managed branch lookup failed (HTTP ${ref.status}).`);
          const sha = (await ref.json()).object?.sha;
          if (!/^[a-f0-9]{40}$/i.test(sha ?? "")) throw new Error("Invalid managed branch SHA.");
          const result = await request(`compare/main...${sha}`);
          if (!result.ok) throw new Error(`Managed branch comparison failed (HTTP ${result.status}).`);
          const comparison = await result.json();
          const isBot = (commit) => commit.author?.login === "github-actions[bot]" &&
            commit.committer?.login === "github-actions[bot]";
          if (!Array.isArray(comparison.commits) || !Array.isArray(comparison.files) ||
              comparison.files.length >= 300 ||
              comparison.total_commits !== comparison.commits.length ||
              comparison.commits.some((commit) => !isBot(commit)) ||
              comparison.files.some((file) => !file.filename.startsWith("src/content/posts/repytorch/"))) {
            throw new Error("Managed sync branch contains manual or unexpected changes, or exceeds the complete comparison limit. Preserve and review those changes before rerunning; this workflow will not overwrite them.");
          }
          NODE
      - name: Create or update the single reviewable content PR
        id: content-pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8, verified 2026-10-03
        with:
          token: ${{ github.token }}
          base: main
          branch: codex/repytorch-sync
          add-paths: src/content/posts/repytorch/**
          delete-branch: false
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          committer: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          commit-message: Sync explicitly published repytorch Markdown
          title: "Update published repytorch writing"
          draft: true
          body: |
            Imports only Markdown with `publish: true` from the public `AlphaApaca/repytorch` repository.

            Source links and metadata are pinned to the immutable source commit recorded in each article.
            Regression tests, snapshot validation, Astro checks, and a static build passed in the [sync workflow run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) before these changes were proposed.

            Review the writing and any available Vercel preview, then mark this draft ready and merge manually. This workflow does not approve or merge PRs.

            Bot pushes with `GITHUB_TOKEN` do not trigger push workflows. Bot-created or updated PR workflows require a repository writer to select **Approve workflows to run** in the PR banner. The checks above already validate this snapshot; Vercel bot-commit previews may additionally need deployment authorization. Do not assume a preview exists until Vercel reports a successful deployment.

            `codex/repytorch-sync` is a managed content-only branch. Edit articles in repytorch, not in this branch.
      - name: Summarize the sync result
        env:
          PR_URL: ${{ steps.content-pr.outputs.pull-request-url }}
          PR_OPERATION: ${{ steps.content-pr.outputs.pull-request-operation }}
        run: |
          if [ -n "$PR_URL" ]; then
            printf 'Content PR (%s): %s\n' "$PR_OPERATION" "$PR_URL" >> "$GITHUB_STEP_SUMMARY"
          else
            printf 'No published-content change requires a new PR.\n' >> "$GITHUB_STEP_SUMMARY"
          fi
