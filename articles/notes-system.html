<!doctype html>
<html lang="zh-CN" data-page="articleNotes">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="记录、整理并分享轻量技术笔记的原则。" data-i18n-meta="articleNotes.meta.description">
    <title>让笔记系统保持轻量 | Mingyang Xu</title>
    <link rel="icon" href="../favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="/article-reader.css">
  </head>
  <body class="article-page">
    <header class="site-header">
      <a class="brand" href="/" aria-label="Mingyang Xu home" data-i18n-aria-label="common.homeLabel"><span class="brand-mark">MX</span><span data-i18n="common.name">Mingyang Xu</span></a>
      <nav class="nav-links" aria-label="Primary navigation" data-i18n-aria-label="common.primaryNav">
        <a href="/#projects" data-i18n="nav.projects">项目</a>
        <a href="/#experience" data-i18n="nav.experience">经历</a>
        <a href="/writing/" data-i18n="nav.posts">文章</a>
        <a href="/about/" data-i18n="nav.about">关于</a>
      </nav>
      <div class="header-actions">
        <button class="lang-toggle" type="button" aria-label="Switch language" title="Switch language">EN</button>
        <button class="icon-button theme-toggle" type="button" aria-label="切换深色模式" title="切换深色模式" data-i18n-aria-label="common.themeToggle" data-i18n-title="common.themeToggle">
          <span class="sun" aria-hidden="true">☀</span>
          <span class="moon" aria-hidden="true">☾</span>
        </button>
      </div>
    </header>

    <main class="article-shell article-with-reader">
      <div class="article-heading">
        <p class="eyebrow" data-i18n="articleNotes.eyebrow">笔记 / 写作</p>
        <h1 data-i18n="articleNotes.title">让笔记系统保持轻量</h1>
        <p class="article-lead" data-i18n="articleNotes.lead">笔记系统的价值不是复杂分类，而是降低记录和回看的阻力。</p>
      </div>

      <div class="article-reading-layout">
        <div class="article-main">
          <article class="article-content">
            <h2 id="articleNotes-h2a" data-i18n="articleNotes.h2a">先记录，再整理</h2>
            <p data-i18n="articleNotes.p1">不要让分类系统挡在输入之前。一个收集入口和一个每周整理节奏，通常比复杂标签更可靠。</p>

            <h2 id="articleNotes-h2b" data-i18n="articleNotes.h2b">公开输出要更小</h2>
            <p data-i18n="articleNotes.p2">短笔记可以只回答一个问题、解释一个概念，或记录一次决策。小而完整的输出更容易持续。</p>
          </article>
        </div>
        <aside class="article-reader" data-article-reader>
          <details class="article-reader-panel" open>
            <summary><span data-reader-title>文章目录</span><span class="reader-percentage" data-reader-value hidden>0%</span></summary>
            <div class="reader-progress" data-reader-progress hidden>
              <span data-reader-progress-label>阅读进度</span>
              <progress data-reader-bar max="100" value="0" aria-label="阅读进度"></progress>
            </div>
            <nav class="reader-toc" data-reader-nav aria-label="文章目录">
              <ol>
                <li class="reader-item" data-depth="2"><a data-reader-link href="#articleNotes-h2a">先记录，再整理</a></li>
                <li class="reader-item" data-depth="2"><a data-reader-link href="#articleNotes-h2b">公开输出要更小</a></li>
              </ol>
            </nav>
          </details>
        </aside>
      </div>
    </main>

    <script src="../script.js"></script>
    <script type="module" src="/article-reader.js"></script>
  </body>
</html>
